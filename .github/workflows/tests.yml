name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # The unit tests need no radiographs and no PyTorch, so CI installs only
      # the libraries they import (same pinned versions as requirements.txt).
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.2.6 opencv-python-headless==4.10.0.84 pandas==2.3.3 \
            PyYAML==6.0.3 scikit-learn==1.7.2 scipy==1.15.3 matplotlib==3.10.9
      - name: Run unit tests (includes compiling the C++ median filter with g++)
        run: python -m unittest tests.test_sample tests.test_preprocess tests.test_metrics -v
